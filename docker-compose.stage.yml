version: '3.8'

services:
  app:
    image: danilaustinov/devops-u-app:dev
    container_name: devops-u-app-stage
    ports:
      - "5001:5000"
    volumes:
      - ./conference.db:/app/conference.db
      - ./data:/app/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_ENV=stage
      - FLASK_RUN_HOST=0.0.0.0
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: redis-stage
    ports:
      - "6379:6379"
    volumes:
      - redis_data_stage:/data
    restart: unless-stopped

volumes:
  redis_data_stage:
